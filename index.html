<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dad's Cassette Collection</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("images/image001.png");
            background-size: cover;
            background-position: center;

            font-family: Georgia, serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        .player {
            position: relative;
            z-index: 1;

            width: 50%;
            max-width: 600px;

            padding: 15px 20px;;
            margin-bottom: 25px;
            
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;

            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .song-title {
            font-size: 20px;
            margin-top: 15px;
        }

        .artist {
            font-size: 14px;
            margin-top: 6px;
            opacity: 0.85;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            font-size: 14px;
            padding: 8px 14px;
            margin: 5px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="player">

        <h1>Dad's Cassette Collection</h1>

        <div class="song-title">
            Main Duniya Bhula Doonga Teri Chahat Mein
        </div>

        <div class="artist">
            Anuradha Paudwal, Kumar Sanu · 1990
        </div>

        <audio id="audioPlayer"></audio>

<div class="controls">
    <button onclick="previousSong()">⏮ Previous</button>
    <button onclick="togglePlay()">▶ Play / Pause</button>
    <button onclick="nextSong()">Next ⏭</button>
</div>

<script>

let songs = [];
let currentSong = 0;

const audioPlayer = document.getElementById("audioPlayer");

fetch("data/music.json")
    .then(response => response.json())
    .then(data => {

        songs = data;

        loadSong(currentSong);

    });

function loadSong(index) {

    const song = songs[index];

    audioPlayer.src = song.song_url;

    document.querySelector(".song-title").textContent = song.title;

    document.querySelector(".artist").textContent =
        song.artists + " · " + song.year;

    document.body.style.backgroundImage =
        `url("${song.background_url}")`;
}

function togglePlay() {

    if (audioPlayer.paused) {
        audioPlayer.play();
    } else {
        audioPlayer.pause();
    }

}

function nextSong() {

    if (currentSong < songs.length - 1) {

        currentSong++;

        loadSong(currentSong);
        audioPlayer.play();

    }

}

function previousSong() {

    if (currentSong > 0) {

        currentSong--;

        loadSong(currentSong);
        audioPlayer.play();

    }

}

</script>

    </div>

</body>
</html>
