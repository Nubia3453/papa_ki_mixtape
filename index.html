<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    >

    <meta name="robots" content="index, follow">

    <meta property="og:description" content="A nostalgic digital cassette experience featuring classic Bollywood songs from the 1980s and 1990s.">

    <meta property="og:url" content="https://nubia3453.github.io/papa_ki_mixtape/">

<link
    rel="canonical"

>

    <style>
        @media (max-width: 600px) {
            .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap;
            }

        .controls button {
            margin: 0;
            padding: 8px 9px;
            font-size: 12px;
            white-space: nowrap;
            }
    /* mobile adjustments */
        }
        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("images/image001.png");
            background-size: cover;
            background-position: center;

            font-family: Georgia, serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
    
            background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.05) 45%,
            rgba(0, 0, 0, 0.75) 100%
            );
        }

        .player {
            position: relative;
            z-index: 1;

        width: 60%;
        max-width: 650px;

        padding: 15px 20px;
        margin-bottom: 25px;

        background: transparent;
        }
        h1 {
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0 0 25px 0;
            opacity: 0.85;
        }

        .song-title {
            font-size: 20px;
            font-weight: normal;
            line-height: 1.3;
            margin: 0;
        }

        .artist {
            font-size: 13px;
            margin-top: 7px;
            opacity: 0.65;
            letter-spacing: 0.5px
        }
        .progress-container {
            width: 400px;
            max-width: 90%;
            margin: 12px auto 15px;
        }
        #progressBar {
            width: 100%;
            cursor: pointer;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            font-size: 14px;
            padding: 8px 14px;
            margin: 5px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;

            cursor: pointer;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.65;
            margin-top: 4px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="player">

        <h1>Papa Ki Mixtape</h1>

        <div class="song-title">
            Main Duniya Bhula Doonga Teri Chahat Mein
        </div>

        <div class="artist">
            Anuradha Paudwal, Kumar Sanu · 1990
        </div>

        <audio id="audioPlayer"></audio>
        <div class="progress-container">

            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                step="0.1"
            >

            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>


<div class="controls">
    <button onclick="previousSong()">⏮ Previous</button>
    <button onclick="togglePlay()">▶ Play / Pause</button>
    <button onclick="nextSong()">Next ⏭</button>
</div>

<script>

let songs = [];
let currentSong = 0;

const audioPlayer = document.getElementById("audioPlayer");

const progressBar = document.getElementById("progressBar");
const currentTimeDisplay = document.getElementById("currentTime");
const durationDisplay = document.getElementById("duration")

audioPlayer.addEventListener("timeupdate", () => {

    progressBar.value = audioPlayer.currentTime;

    currentTimeDisplay.textContent =
        formatTime(audioPlayer.currentTime);

});

audioPlayer.addEventListener("loadedmetadata", () => {

    progressBar.max = audioPlayer.duration;

    durationDisplay.textContent =
        formatTime(audioPlayer.duration);

});

progressBar.addEventListener("input", () => {

    audioPlayer.currentTime = progressBar.value;

});
fetch("data/music.json")
    .then(response => response.json())
    .then(data => {

        songs = data;

        loadSong(currentSong);

    });

function loadSong(index) {

    const song = songs[index];

    audioPlayer.src = song.song_url;
    progressBar.value = 0;
    currentTimeDisplay.textContent = "0:00";
    durationDisplay.textContent = "0:00";

    document.querySelector(".song-title").textContent = song.title;

    document.querySelector(".artist").textContent =
        song.artists + " · " + song.year;

    document.body.style.backgroundImage =
        `url("${song.background_url}")`;
}
function formatTime(seconds) {

    if (isNaN(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return minutes + ":" + String(secs).padStart(2, "0");
}

function togglePlay() {

    if (audioPlayer.paused) {
        audioPlayer.play();
    } else {
        audioPlayer.pause();
    }

}

function nextSong() {

    if (currentSong < songs.length - 1) {

        currentSong++;

        loadSong(currentSong);
        audioPlayer.play();

    }

}

function previousSong() {

    if (currentSong > 0) {

        currentSong--;

        loadSong(currentSong);
        audioPlayer.play();

    }

}
audioPlayer.addEventListener("ended", () => {

    if (currentSong < songs.length - 1) {

        currentSong++;

        loadSong(currentSong);

        audioPlayer.play();

    }

});

</script>

    </div>

</body>
</html>
